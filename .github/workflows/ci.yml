name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm ci

      - name: Validate HTML
        run: npx html-validate index.html

      - name: Lint CSS
        run: npx stylelint 'css/**/*.css' || true

      - name: Lint JS
        run: npx eslint 'js/**/*.js' || true

  lighthouse:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run Lighthouse
        uses: treosh/lighthouse-ci-action@v11
        with:
          urls: |
            https://duckmusic.com.br
          configPath: ./lighthouserc.json
          uploadArtifacts: true
